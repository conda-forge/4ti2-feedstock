schema_version: 1

context:
  name: 4ti2
  version: "1.6.16"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/4ti2/4ti2/releases/download/Release_${{ version | replace(".", "_") }}/4ti2-${{ version }}.tar.gz
  sha256: a45629835ac138bb17896c509278b956c11917ec58e57165a2ee0c54ed0307cb
  patches:
    - 0001-include-ctime-in-Heuristics.patch

build:
  number: 0

requirements:
  build:
    - if: unix
      then:
        - ${{ compiler("c") }}
        - ${{ compiler("cxx") }}
        - ${{ stdlib("c") }}
        - make
    - if: win
      then:
        - ${{ compiler("m2w64_c") }}
        - ${{ compiler("m2w64_cxx") }}
        - ${{ stdlib("m2w64_c") }}
        - m2-base
        - m2-diffutils
        - m2-make
  host:
    - gmp
    - glpk

tests:
  - script:
      - gensymm --version

about:
  homepage: https://4ti2.github.io/
  license: GPL-2.0-or-later
  license_file: COPYING
  summary: A software package for algebraic, geometric and combinatorial problems on linear spaces
  documentation: https://4ti2.github.io/
  repository: https://github.com/4ti2/4ti2

extra:
  recipe-maintainers:
    - saraedum
